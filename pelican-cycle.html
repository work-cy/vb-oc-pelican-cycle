<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f6f3eb">
  <title>海风骑行 · Pelican Cycling Club</title>
  <style>
    :root {
      color-scheme: light;
      --page: #f6f3eb;
      --panel: #fdfbf5;
      --ink: #294940;
      --muted: #79877a;
      --border: #dce1d5;
      --sky: #e6efe8;
      --sea: #b2d3ca;
      --sea-front: #9fc7bc;
      --sea-line: #d9e8d9;
      --island: #adc4aa;
      --hill: #cbd2aa;
      --sand: #e9ddb9;
      --road: #f2e8cd;
      --grass: #8eab7b;
      --mark: #d2c59e;
      --sun: #edb967;
      --cloud: #fcfbef;
      --line: #304b44;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-width: 320px;
      min-height: 100svh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      background: var(--page);
      color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      transition: background .7s, color .7s;
    }
    body[data-theme="night"] {
      color-scheme: dark;
      --page: #182e34;
      --panel: #213c40;
      --ink: #edf0df;
      --muted: #a1b9ad;
      --border: #3e5756;
      --sky: #264951;
      --sea: #36636b;
      --sea-front: #2d5861;
      --sea-line: #648784;
      --island: #456d66;
      --hill: #738775;
      --sand: #a7aa88;
      --road: #c6c3a2;
      --grass: #547762;
      --mark: #9da784;
      --sun: #f4e5b1;
      --cloud: #71938e;
    }
    button, input { font: inherit; }
    button { -webkit-tap-highlight-color: transparent; }
    button:focus-visible, input:focus-visible { outline: 3px solid #eaa76e; outline-offset: 5px; }
    .shell { width: min(1440px, 100%); margin: auto; padding: 26px 42px 19px; }
    .masthead { display: flex; align-items: center; justify-content: space-between; gap: 20px; padding: 2px 2px 23px; }
    .brand { display: flex; align-items: center; gap: 12px; }
    .brand-symbol { width: 39px; height: 39px; }
    .brand-name { font-weight: 750; font-size: 12px; letter-spacing: 2.4px; line-height: 1.5; }
    .edition { display: flex; align-items: center; gap: 10px; font-size: 11px; letter-spacing: 1.4px; color: var(--muted); }
    .edition span:first-child { width: 6px; height: 6px; border-radius: 50%; background: #ce9459; }
    .postcard { overflow: hidden; border: 1px solid var(--border); border-radius: 24px; background: var(--panel); box-shadow: 0 16px 55px #324a3510; }
    .artboard { position: relative; height: clamp(460px, 49vw, 675px); overflow: hidden; background: var(--sky); isolation: isolate; }
    .scene { display: block; width: 100%; height: 100%; }
    .scene .weather-color { transition: fill .8s, stroke .8s; }
    .heading { position: absolute; top: 39px; left: 45px; pointer-events: none; }
    .eyebrow { display: flex; align-items: center; gap: 8px; font-size: 10px; font-weight: 650; letter-spacing: 2.3px; margin: 0 0 17px; }
    .eyebrow::before { content: ""; width: 25px; height: 1px; background: currentColor; opacity: .65; }
    h1 { margin: 0; font-family: "Songti SC", "STSong", "Noto Serif CJK SC", "SimSun", Georgia, serif; font-size: clamp(35px, 4.15vw, 57px); font-weight: 500; letter-spacing: 3px; line-height: 1.24; }
    .intro { margin: 15px 0 0; font-size: 12px; color: var(--muted); letter-spacing: .6px; line-height: 1.8; }
    .weather { position: absolute; top: 33px; right: 34px; display: flex; align-items: center; gap: 8px; font-size: 11px; letter-spacing: 1px; padding: 8px 12px; border: 1px solid #55745d25; border-radius: 24px; color: var(--ink); }
    .weather svg { width: 17px; height: 17px; }
    .scene-note { position: absolute; bottom: 25px; left: 34px; display: flex; align-items: center; gap: 11px; font-size: 10px; letter-spacing: 1.8px; color: #58725d; }
    .scene-note svg { width: 24px; height: 24px; }
    .route-label { position: absolute; bottom: 28px; right: 35px; color: #6c7b5e; font-size: 10px; letter-spacing: 2px; }
    .controls { display: flex; align-items: center; gap: 18px; padding: 22px 32px; min-height: 92px; border-top: 1px solid var(--border); }
    .play { display: grid; place-items: center; border: 0; width: 46px; height: 46px; flex: 0 0 auto; border-radius: 50%; background: var(--ink); color: var(--panel); cursor: pointer; transition: transform .18s, background .7s; }
    .play:hover { transform: scale(1.06); }
    .play:active { transform: scale(.94); }
    .play svg { width: 17px; height: 17px; }
    .play .play-icon { display: none; }
    .play[aria-pressed="false"] .pause-icon { display: none; }
    .play[aria-pressed="false"] .play-icon { display: block; }
    .status { min-width: 140px; }
    .status strong { display: block; font-weight: 550; font-size: 13px; letter-spacing: .8px; }
    .status small { display: block; margin-top: 6px; font-size: 9px; letter-spacing: 1.5px; color: var(--muted); }
    .speed-control { margin-left: auto; display: flex; align-items: center; gap: 15px; }
    .speed-control label { color: var(--muted); font-size: 11px; letter-spacing: .5px; }
    input[type="range"] { --fill: 33.333%; width: 145px; height: 4px; margin: 0; border-radius: 8px; appearance: none; -webkit-appearance: none; background: linear-gradient(to right, var(--ink) 0 var(--fill), var(--border) var(--fill) 100%); cursor: pointer; touch-action: pan-y; }
    input[type="range"]::-webkit-slider-thumb { appearance: none; -webkit-appearance: none; width: 13px; height: 13px; border-radius: 50%; background: var(--ink); border: 3px solid var(--panel); box-shadow: 0 0 0 1px var(--ink); }
    input[type="range"]::-moz-range-thumb { width: 9px; height: 9px; border-radius: 50%; background: var(--ink); border: 2px solid var(--panel); box-shadow: 0 0 0 1px var(--ink); }
    output { width: 36px; font-size: 11px; font-variant-numeric: tabular-nums; }
    .divider { width: 1px; height: 25px; background: var(--border); margin: 0 5px 0 8px; }
    .theme { display: flex; align-items: center; justify-content: center; gap: 9px; border: 0; background: transparent; color: var(--ink); padding: 10px 0 10px 9px; cursor: pointer; font-size: 11px; white-space: nowrap; }
    .theme svg { width: 18px; height: 18px; }
    .theme .day-icon { display: none; }
    body[data-theme="night"] .theme .day-icon { display: block; }
    body[data-theme="night"] .theme .night-icon { display: none; }
    .footer { display: flex; justify-content: space-between; gap: 20px; padding: 19px 3px 0; color: var(--muted); font-size: 10px; line-height: 1.7; letter-spacing: 1px; }
    .footer .english { font-family: Georgia, serif; font-style: italic; font-size: 12px; letter-spacing: .4px; }
    .stars, .moon-details { opacity: 0; transition: opacity .8s; }
    .sun-rays { opacity: 1; transition: opacity .8s; }
    body[data-theme="night"] .stars, body[data-theme="night"] .moon-details { opacity: 1; }
    body[data-theme="night"] .sun-rays { opacity: 0; }
    @media (min-width: 1550px) { .shell { padding-top: 36px; padding-bottom: 32px; } }
    @media (max-width: 700px) {
      .shell { padding: 19px 15px 15px; }
      .masthead { padding: 0 4px 17px; }
      .brand { gap: 9px; }
      .brand-symbol { width: 32px; height: 32px; }
      .brand-name { font-size: 9px; letter-spacing: 1.9px; }
      .edition { font-size: 9px; letter-spacing: .6px; }
      .postcard { border-radius: 19px; }
      .artboard { height: 490px; }
      .heading { top: 27px; left: 25px; }
      .eyebrow { font-size: 8px; margin-bottom: 13px; letter-spacing: 1.7px; }
      h1 { font-size: 34px; letter-spacing: 1px; }
      .intro { margin-top: 12px; font-size: 10px; max-width: 140px; line-height: 1.9; }
      .weather { top: 24px; right: 19px; padding: 6px 8px; font-size: 9px; }
      .scene-note { bottom: 24px; left: 21px; font-size: 8px; gap: 7px; letter-spacing: 1px; }
      .route-label { right: 20px; bottom: 28px; font-size: 8px; letter-spacing: .8px; }
      .controls { flex-wrap: wrap; gap: 12px; padding: 17px 21px 21px; }
      .play { width: 41px; height: 41px; }
      .status { flex: 1; min-width: 100px; }
      .status strong { font-size: 12px; }
      .status small { font-size: 8px; }
      .speed-control { order: 4; width: 100%; gap: 14px; border-top: 1px solid var(--border); margin-top: 4px; padding-top: 20px; }
      .speed-control input { flex: 1; width: auto; }
      .divider { display: none; }
      .theme { padding: 9px 0 9px 6px; }
      .theme span { display: none; }
      .footer { font-size: 9px; padding-top: 15px; letter-spacing: .1px; }
      .footer .english { font-size: 10px; }
    }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition: none !important; } }
  </style>
</head>

            <circle cx="710" cy="579" r="23" fill="#d6d8b8" stroke="#304b44" stroke-width="3"/>
            <g id="chainring" transform="translate(710 579)" fill="none" stroke="#68856a" stroke-width="2.5"><circle r="15"/><path d="M-15 0H15M0-15V15"/></g>
            <path id="crankArms" d="M668 579H752" fill="none" stroke="#304b44" stroke-width="7"/>
            <path id="crankHighlight" d="M668 579H752" fill="none" stroke="#b2bda1" stroke-width="3"/>
            <path id="nearLegOutline" d="M686 429Q789 476 752 569" fill="none" stroke="#8d6741" stroke-width="16"/>
            <path id="nearLeg" d="M686 429Q789 476 752 569" fill="none" stroke="#e7af65" stroke-width="11"/>
            <g id="nearFoot" transform="translate(752 579)">
              <path d="M-13-13q8-6 18 0l18 7 9 4q3 6-4 7H-14q-7-1-4-8Z" fill="#e9ae60" stroke="#936b43" stroke-width="2"/>
              <path d="m6-5 11 7M17-5l10 7" stroke="#c38947" stroke-width="1.5" fill="none"/>
              <rect x="-19" y="6" width="45" height="7" rx="3" fill="#41564a"/>
              <path d="M-12 9H18" stroke="#b1b99b" stroke-width="1.5"/>
            </g>
            <circle cx="710" cy="579" r="5" fill="#304b44"/>
          </g>

          <!-- The pelican's silhouette uses a long bill, a broad pouch and an S-shaped neck. -->
          <g id="rider" stroke="#304b44" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M573 363q-35-3-65-29 5 31 31 43-22-5-36-11 12 29 53 31Z" fill="#e7e8d8"/>
            <path d="m519 350 33 29m-36-5 27 9" fill="none" stroke="#b3c4b4" stroke-width="2"/>
            <path d="M681 349c-29-34-87-35-112-6-23 27-20 62 6 83 30 27 87 33 129 15 42-18 55-48 39-76-12-20-38-26-62-16Z" fill="#faf7e9"/>
            <path d="M562 384c6 27 32 47 61 52 34 7 65-2 86-20-4 19-22 30-45 33-48 8-91-17-102-43Z" fill="#dce3d2" stroke="none"/>
            <path d="M572 372q-3 15 5 27M581 402l8 8M602 422l11 4" fill="none" stroke="#bbcbbc" stroke-width="2"/>
            <g id="neckHead">
              <path d="M673 371c-13-28-2-47 9-77 8-24 3-44 17-65 11-20 29-30 48-26 31 6 47 33 33 58-9 16-27 22-38 41-13 23-5 44 4 62 8 18 2 31-10 41" fill="#faf7e9"/>
              <path d="M704 243c-10 27-3 39-15 68-10 25-13 44-3 60" fill="none" stroke="#dae2d2" stroke-width="13"/>
              <path d="M722 203q-8-13-19-15 3 10 9 17m7-4q-1-13 8-18 6 12 5 18" fill="#faf7e9" stroke-width="2.5"/>
              <path d="M779 264 940 273c-23 20-55 47-88 48-40 1-61-29-73-57Z" fill="#e6a266"/>
              <path d="M793 278c16 25 33 37 58 36 25-2 49-17 69-32-32 13-76 16-127-4Z" fill="#d38b54" stroke="none" opacity=".6"/>
              <path d="M781 249c48 2 105 11 158 19 7 1 9 5 3 8-48 2-109-3-162-8Z" fill="#efbc68"/>
              <path d="m789 253 133 17" fill="none" stroke="#f9d38a" stroke-width="2"/>
              <path d="M786 268q68 8 151 6" fill="none" stroke="#a87344" stroke-width="1.5"/>
              <circle cx="750" cy="253" r="8" fill="#ecba98" stroke="none" opacity=".63"/>
              <g id="eye" transform="translate(760 238)"><ellipse rx="4.5" ry="6.1" fill="#304b44" stroke="none"/><circle cx="1.2" cy="-2" r="1.3" fill="#fff9ed" stroke="none"/></g>
              <path d="M752 227q6-4 12 1" fill="none" stroke-width="2"/>
              <path d="m710 228 18 42q7 10 18 1l8-10" fill="none" stroke="#596d58" stroke-width="3"/>
              <rect x="731" y="266" width="9" height="7" rx="2" fill="#dc9e72" stroke-width="1.8"/>
              <path d="M697 227c-3-22 14-44 39-46 27-2 48 17 49 44-30-7-55-5-88 2Z" fill="#d6805e"/>
              <path d="M699 222q40-9 84-2l5 8q-39-7-92 3Z" fill="#edaa7b" stroke-width="2.5"/>
              <path d="M725 187q-14 11-14 26m28-28q-7 11-6 25m20-21q6 8 6 19" fill="none" stroke="#a86049" stroke-width="4"/>
              <path d="M704 204q5-12 15-15" fill="none" stroke="#f0b28b" stroke-width="2"/>
            </g>
            <g id="scarf" stroke="#9c5948" stroke-width="2.5">
              <path id="scarfTailBack" d="M698 318C669 301 642 315 608 301l9 20-14 6c38 12 62-6 91 10Z" fill="#c06e54"/>
              <path id="scarfTailFront" d="M700 321C666 320 633 338 599 320l7 22-17 7c38 12 75-16 112-11Z" fill="#e69b6b"/>
              <path id="scarfStripe" d="M609 328l-2 20m14-15-2 18" stroke="#f2c096" stroke-width="4" fill="none"/>
              <path d="m687 313 29 9-6 18q-18-3-30-11Z" fill="#e69b6b"/>
              <path d="m689 317 23 9" fill="none" stroke="#f1bb8b" stroke-width="3"/>
              <path d="M692 325q9-9 16 0l-3 11-13-1Z" fill="#d5875e"/>
            </g>
            <path id="wing" d="M615 366c19-21 47-21 73-5 33 17 45 25 69 25l74 3q10 1 10 8-1 7-14 9l-77 3c-31 4-48 19-75 19-30 0-56-19-60-38" fill="#f2f1e1"/>
            <path id="wingFeathers" d="M638 374q33 20 59 16l64 9m-114-12q25 21 53 18m-39-6q21 17 46 10" fill="none" stroke="#bdcdbb" stroke-width="2"/>
            <path d="M827 391q7 2 8 8m-14-7q6 1 7 9" fill="none" stroke="#a7bba9" stroke-width="1.8"/>
          </g>
          <g id="breeze" stroke="#88a999" stroke-width="2" stroke-linecap="round" opacity=".48" fill="none"><path d="M459 329h34m-63 17h47m-5 22h16"/></g>
          <rect width="1440" height="780" fill="url(#paper)" pointer-events="none"/>
        </svg>

        <div class="heading">
          <p class="eyebrow">A LITTLE COASTAL ESCAPE</p>
          <h1>今天，<br>骑向海风。</h1>
          <p class="intro">不赶时间，只管向前。<br>和鹈鹕一起，把日子骑慢一点。</p>
        </div>
        <div class="weather">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" aria-hidden="true"><path d="M3 8h13c5 0 4-6 1-5M2 12h18M6 16h9c5 0 4 6 1 5"/></svg>
          <span id="weatherText">海风轻轻</span>
        </div>
        <div class="scene-note"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.1" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="m15 8-2 5-5 3 3-6Z" fill="currentColor" stroke="none"/></svg><span>沿着海岸 · 自由骑行</span></div>
        <div class="route-label">THE SLOW WAY HOME ↗</div>
      </div>

      <div class="controls" role="group" aria-label="动画控制">
        <button id="playButton" class="play" type="button" aria-label="暂停动画" aria-pressed="true" title="暂停 / 继续（空格）">
          <svg class="pause-icon" viewBox="0 0 18 18" fill="currentColor" aria-hidden="true"><rect x="4" y="3" width="3" height="12" rx="1"/><rect x="11" y="3" width="3" height="12" rx="1"/></svg>
          <svg class="play-icon" viewBox="0 0 18 18" fill="currentColor" aria-hidden="true"><path d="M5 3q0-1 1 0l10 6-10 6q-1 1-1 0Z"/></svg>
        </button>
        <div class="status"><strong id="statusText">正在兜风</strong><small>ENJOY THE LITTLE THINGS</small></div>
        <div class="speed-control">
          <label for="speed">骑行速度</label>
          <input id="speed" type="range" min="0.5" max="2" step="0.1" value="1" aria-label="骑行速度" aria-valuetext="1 倍速度">
          <output id="speedOutput" for="speed">1.0×</output>
        </div>
        <div class="divider" aria-hidden="true"></div>
        <button id="themeButton" class="theme" type="button" aria-label="切换为夜间风景" aria-pressed="false" title="切换昼夜">
          <svg class="night-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M20.5 14A8.8 8.8 0 0 1 10 3.5 8.8 8.8 0 1 0 20.5 14Z"/></svg>
          <svg class="day-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M2 12h2m16 0h2M5 5l1.5 1.5m11 11L19 19M5 19l1.5-1.5m11-11L19 5"/></svg>
          <span id="themeText">看一会儿月亮</span>
        </button>
      </div>
    </section>
    <footer class="footer"><span>一只鹈鹕，两只车轮，无数好天气。</span><span class="english">Life is better at a gentle pace.</span></footer>
  </main>

  <script>
    (() => {
      'use strict';
      const byId = id => document.getElementById(id);
      const names = ['rearSpokes', 'frontSpokes', 'chainring', 'crankArms', 'crankHighlight', 'farLeg', 'nearLegOutline', 'nearLeg', 'farFoot', 'nearFoot', 'rider', 'neckHead', 'eye', 'scarfTailBack', 'scarfTailFront', 'scarfStripe', 'wing', 'wingFeathers', 'bikeShadow', 'clouds', 'islands', 'waves', 'dunes', 'ground', 'birdA', 'birdB', 'seabirds', 'breeze'];
      const parts = Object.fromEntries(names.map(id => [id, byId(id)]));
      const play = byId('playButton');
      const speed = byId('speed');
      const theme = byId('themeButton');
      const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)');
      const state = { time: 0, speed: 1, playing: !reducedMotion.matches, frame: 0, last: 0, night: false };
      const f = number => number.toFixed(2);
      const set = (name, attr, value) => parts[name].setAttribute(attr, value);

      // A two-segment leg is solved against its own pedal position.
      // The forward-facing knee remains continuous throughout a full revolution.
      function legPath(hipX, hipY, pedalX, pedalY) {
        const ankleY = pedalY - 10;
        const dx = pedalX - hipX;
        const dy = ankleY - hipY;
        const upper = 96;
        const lower = 99;
        const distance = Math.max(0.01, Math.hypot(dx, dy));
        const along = (upper * upper - lower * lower + distance * distance) / (2 * distance);
        const height = Math.sqrt(Math.max(0, upper * upper - along * along));
        const kneeX = hipX + along * dx / distance + height * dy / distance;
        const kneeY = hipY + along * dy / distance - height * dx / distance;
        const beforeX = kneeX + (hipX - kneeX) * 0.10;
        const beforeY = kneeY + (hipY - kneeY) * 0.10;
        const afterX = kneeX + (pedalX - kneeX) * 0.10;
        const afterY = kneeY + (ankleY - kneeY) * 0.10;
        return `M${f(hipX)} ${f(hipY)}L${f(beforeX)} ${f(beforeY)}Q${f(kneeX)} ${f(kneeY)} ${f(afterX)} ${f(afterY)}L${f(pedalX)} ${f(ankleY)}`;
      }

      function draw(time) {
        const travel = time * 228;
        const wheelAngle = travel / 102;
        const phase = wheelAngle / 1.48;
        const degrees = wheelAngle * 180 / Math.PI;
        const pedalDegrees = phase * 180 / Math.PI;
        const bob = Math.sin(phase * 2) * 2.1;
        const nearX = 710 + Math.cos(phase) * 42;
        const nearY = 579 + Math.sin(phase) * 42;
        const farX = 710 - Math.cos(phase) * 42;
        const farY = 579 - Math.sin(phase) * 42;

        set('rearSpokes', 'transform', `rotate(${f(degrees % 360)})`);
        set('frontSpokes', 'transform', `rotate(${f(degrees % 360)})`);
        set('chainring', 'transform', `translate(710 579) rotate(${f(pedalDegrees % 360)})`);
        const crank = `M${f(farX)} ${f(farY)}L${f(nearX)} ${f(nearY)}`;
        set('crankArms', 'd', crank);
        set('crankHighlight', 'd', crank);
        set('farFoot', 'transform', `translate(${f(farX)} ${f(farY)})`);
        set('nearFoot', 'transform', `translate(${f(nearX)} ${f(nearY)})`);
        set('farLeg', 'd', legPath(666, 429 + bob, farX, farY));
        const nearLeg = legPath(686, 429 + bob, nearX, nearY);
        set('nearLegOutline', 'd', nearLeg);
        set('nearLeg', 'd', nearLeg);
        set('rider', 'transform', `translate(0 ${f(bob)})`);
        set('neckHead', 'transform', `rotate(${f(Math.sin(phase) * .75)} 712 326)`);
        set('bikeShadow', 'rx', f(274 + Math.sin(phase * 2) * 2));

        // Keep the wing tip on the handlebar while the rider gently bobs.
        set('wing', 'd', `M615 366c19-21 47-21 73-5 33 17 45 25 69 25L831 ${f(389 - bob)}q10 1 10 8-1 7-14 9L750 409c-31 4-48 19-75 19-30 0-56-19-60-38`);
        const flutter = Math.sin(time * 5.1) * 7;
        const tip = Math.sin(time * 5.1 - 1.3) * 8;
        set('scarfTailBack', 'd', `M698 318C669 ${f(301 + flutter)} 642 ${f(315 - flutter)} 608 ${f(301 + tip)}l9 20-14 6c38 12 62-6 91 10Z`);
        set('scarfTailFront', 'd', `M700 321C666 ${f(320 + flutter)} 633 ${f(338 - flutter)} 599 ${f(320 + tip)}l7 22-17 7C627 ${f(361 + tip)} 665 ${f(333 + flutter)} 701 338Z`);
        set('scarfStripe', 'd', `M609 ${f(328 + tip)}l-2 20m14-15-2 18`);

        const blinkCycle = time % 7.2;
        const openness = blinkCycle > 6.8 && blinkCycle < 7.06
          ? Math.max(.08, Math.abs((blinkCycle - 6.93) / .13)) : 1;
        set('eye', 'transform', `translate(760 238) scale(1 ${f(openness)})`);
        set('clouds', 'transform', `translate(${f(-(time * 8 % 1440))} 0)`);
        set('islands', 'transform', `translate(${f(-(time * 12 % 1440))} 0)`);
        set('waves', 'transform', `translate(${f(-(time * 33 % 1440))} 0)`);
        set('dunes', 'transform', `translate(${f(-(time * 64 % 1440))} 0)`);
        set('ground', 'transform', `translate(${f(-(travel % 1440))} 0)`);
        const flap = Math.sin(time * 2.4) * 6;
        set('birdA', 'd', `M974 ${f(329 + flap)}q12 ${f(-10 - flap)} 23 6q11 ${f(-16 - flap)} 23 ${f(-6 + flap)}`);
        set('birdB', 'd', `M1044 ${f(312 - flap * .6)}q9 ${f(-7 + flap * .6)} 17 4q8 ${f(-11 + flap * .6)} 17 ${f(-4 - flap * .6)}`);
        set('seabirds', 'transform', `translate(${f(Math.sin(time * .16) * 28)} ${f(Math.sin(time * .55) * 4)})`);
        set('breeze', 'transform', `translate(${f(-Math.sin(time * 2) * 7)} 0)`);
        set('breeze', 'opacity', f(.28 + (Math.sin(time * 2) + 1) * .13));
      }

      function frame(now) {
        if (!state.playing || document.hidden) { state.frame = 0; return; }
        const delta = state.last ? Math.min((now - state.last) / 1000, .05) : 0;
        state.last = now;
        state.time += delta * state.speed;
        draw(state.time);
        state.frame = requestAnimationFrame(frame);
      }

      function syncPlayback() {
        play.setAttribute('aria-pressed', String(state.playing));
        play.setAttribute('aria-label', state.playing ? '暂停动画' : '继续动画');
        byId('statusText').textContent = state.playing ? '正在兜风' : '停一下，看看海';
        if (state.frame) cancelAnimationFrame(state.frame);
        state.frame = 0;
        state.last = 0;
        if (state.playing && !document.hidden) state.frame = requestAnimationFrame(frame);
      }

      play.addEventListener('click', () => { state.playing = !state.playing; syncPlayback(); });
      speed.addEventListener('input', () => {
        state.speed = Number(speed.value);
        byId('speedOutput').value = `${state.speed.toFixed(1)}×`;
        speed.setAttribute('aria-valuetext', `${state.speed.toFixed(1)} 倍速度`);
        speed.style.setProperty('--fill', `${(state.speed - .5) / 1.5 * 100}%`);
      });
      theme.addEventListener('click', () => {
        state.night = !state.night;
        document.body.dataset.theme = state.night ? 'night' : 'day';
        theme.setAttribute('aria-pressed', String(state.night));
        theme.setAttribute('aria-label', state.night ? '切换为白天风景' : '切换为夜间风景');
        byId('themeText').textContent = state.night ? '迎着阳光出发' : '看一会儿月亮';
        byId('weatherText').textContent = state.night ? '月色温柔' : '海风轻轻';
        document.querySelector('meta[name="theme-color"]').content = state.night ? '#182e34' : '#f6f3eb';
      });
      document.addEventListener('keydown', event => {
        if (event.code !== 'Space' || event.repeat || /^(INPUT|BUTTON|TEXTAREA|SELECT)$/.test(event.target.tagName) || event.target.isContentEditable) return;
        event.preventDefault();
        state.playing = !state.playing;
        syncPlayback();
      });
      document.addEventListener('visibilitychange', syncPlayback);
      reducedMotion.addEventListener('change', event => {
        if (event.matches) { state.playing = false; syncPlayback(); }
      });
      draw(0);
      syncPlayback();
    })();
  </script>
</body>
